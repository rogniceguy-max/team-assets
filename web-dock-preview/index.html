<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共创 · 团队资产库</title><link rel="stylesheet" href="/styles.css?v=4d9162da1284"><link rel="stylesheet" href="/dock.css?v=e2f62861c8da"><link rel="stylesheet" href="/header.css?v=533f87c6e979"><link rel="stylesheet" href="/asset-pool.css?v=3374b2eb4873"><link rel="stylesheet" href="/candidate-library.css?v=folder-hybrid-20260922"><link rel="stylesheet" href="/preview.css?v=preview-20260922-flicker3"></head>
<body>
<header class="site-header"><div class="header-project"><div class="project-picker"><select id="projectSelect" aria-label="选择项目"></select><span class="header-icon" aria-hidden="true" style="--icon:url(/icons/header-chevron.svg)"></span></div><button id="projectBtn" class="header-square" title="新建项目" aria-label="新建项目"><span class="header-icon" aria-hidden="true" style="--icon:url(/icons/header-plus.svg)"></span></button></div><nav class="header-libraries" aria-label="板块切换"><button id="candidateLibrary" class="header-button" aria-current="false"><span class="header-icon figma-header-icon" aria-hidden="true" style="--icon:url(/icons/header-candidate.svg)"></span><span>候选库</span></button><button id="storyLibrary" class="header-button" aria-current="false"><span class="header-icon figma-header-icon" aria-hidden="true" style="--icon:url(/icons/header-story.svg)"></span><span>剧情库</span></button><button id="assetsLibrary" class="header-button is-active" aria-current="page"><span class="header-icon" aria-hidden="true" style="--icon:url(/icons/header-assets.svg)"></span><span>资产库</span></button><button id="mediaLibrary" class="header-button"><span class="header-icon" aria-hidden="true" style="--icon:url(/icons/header-media.svg)"></span><span>媒体库</span></button></nav><nav class="header-actions" aria-label="项目记录"><button id="historyBtn" class="header-button"><span class="header-icon" aria-hidden="true" style="--icon:url(/icons/header-history.svg)"></span><span>历史记录</span></button><button id="trashBtn" class="header-button"><span class="header-icon" aria-hidden="true" style="--icon:url(/icons/header-trash.svg)"></span><span>回收站</span></button></nav></header>
<main>
<section class="workspace" aria-label="资产工作台"><nav id="dock" aria-label="素材筛选工具栏"></nav>
<div class="table-caption"><span id="counts">共 0 个资产</span><span>拖入图片即可上传</span></div><div id="board"></div></section>
<footer><span>共创 / TEAM ASSET SPACE</span><span>一个地址，一起创作。</span></footer></main>
<dialog id="formDialog"><form id="entityForm"><div class="dialog-top"><h2 id="formTitle"></h2><button type="button" class="icon" data-close aria-label="关闭">×</button></div><div id="formFields"></div><p class="form-error" id="formError" role="alert"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary" id="formSubmit" type="submit">创建</button></div></form></dialog>
<dialog id="detail" class="drawer"><div class="dialog-top"><div><div class="eyebrow">VARIANT DETAILS</div><h2 id="detailTitle"></h2></div><button class="icon" data-close aria-label="关闭详情">×</button></div><form id="detailForm"><label>变体名称<input name="name" required maxlength="200"></label><label>使用集数<input name="episodes" maxlength="500" placeholder="例如 3-10、all、>35；留空为未知"></label><label>设定说明<textarea name="description" rows="5" maxlength="20000"></textarea></label><p id="detailStatus" role="status">修改后点击保存</p><button type="submit" class="primary">保存修改</button></form><section id="conflictBox" hidden><h3>合并其他人的更新</h3><p>你的输入保留在上方。先载入最新内容进行对照，再手动合并。</p><button id="loadLatest" type="button">载入最新版本以对照</button><pre id="latestFields" hidden></pre><button id="mergeVersion" type="button" hidden>我已合并，采用此版本号</button></section><h3>候选素材</h3><div id="detailMaterials" class="material-grid"></div><button id="detailUpload">＋ 上传图片</button></dialog>
<dialog id="preview" class="preview"><div class="dialog-top"><h2 id="previewTitle"></h2><button class="icon" data-close aria-label="关闭预览">×</button></div><img id="previewImage" alt=""><div class="preview-actions"><button id="prevImage" aria-label="上一张">←</button><button id="nextImage" aria-label="下一张">→</button><span id="previewSource"></span><a id="download" class="button" download>下载原图 ↗</a><button id="setFinal" class="primary">设为定稿</button><button id="deleteMaterial">移入回收站</button></div></dialog>
<div id="previewOverlay" hidden role="dialog" aria-modal="true" aria-label="素材预览" tabindex="-1">
<div class="preview-overlay-backdrop" data-preview-dismiss></div>
<div class="preview-overlay-content">
<div class="preview-filmstrip" id="previewFilmstrip" aria-label="相关素材"></div>
<div class="preview-stage" id="previewStage">
<button class="preview-neighbor preview-neighbor-prev" id="previewNeighborPrev" type="button" aria-label="上一张"></button>
<div class="preview-current" id="previewCurrent"></div>
<button class="preview-neighbor preview-neighbor-next" id="previewNeighborNext" type="button" aria-label="下一张"></button>
</div>
<div class="preview-caption" id="previewCaption"></div>
</div>
<div class="preview-toolbar" id="previewToolbar" role="toolbar" aria-label="素材操作">
<button type="button" data-preview-action="rename" aria-label="重命名" data-tip="重命名"><span class="preview-toolbar-icon" style="--icon:url(/icons/context-rename.svg)"></span></button>
<button type="button" data-preview-action="mark" aria-label="标记" data-tip="标记"><span class="preview-toolbar-icon" data-preview-marker style="--icon:url(/icons/context-mark.svg)"></span></button>
<button type="button" data-preview-action="highlight" aria-label="高亮显示" data-tip="高亮显示"><span class="preview-toolbar-icon" style="--icon:url(/icons/context-highlight.svg)"></span></button>
<button type="button" data-preview-action="download" aria-label="下载" data-tip="下载"><span class="preview-toolbar-icon" style="--icon:url(/icons/preview-download.svg)"></span></button>
<button type="button" data-preview-action="set-final" aria-label="设为定稿" data-tip="设为定稿" hidden><span class="preview-toolbar-icon" style="--icon:url(/icons/asset-final.svg)"></span></button>
<button type="button" data-preview-action="disable" aria-label="禁用" data-tip="禁用"><span class="preview-toolbar-icon" data-preview-disable style="--icon:url(/icons/context-disable.svg)"></span></button>
</div>
<div class="preview-mark-menu" id="previewMarkMenu" hidden role="menu" aria-label="素材分类">
<button type="button" class="preview-mark-current" aria-label="标记" data-preview-marker-menu><span class="preview-toolbar-icon" style="--icon:url(/icons/context-mark.svg)"></span></button>
<button type="button" data-preview-category="人物" aria-label="人物" data-tip="人物"><span class="preview-toolbar-icon" style="--icon:url(/icons/context-person.svg)"></span></button>
<button type="button" data-preview-category="场景" aria-label="场景" data-tip="场景"><span class="preview-toolbar-icon" style="--icon:url(/icons/context-scene.svg)"></span></button>
<button type="button" data-preview-category="道具" aria-label="道具" data-tip="道具"><span class="preview-toolbar-icon" style="--icon:url(/icons/context-prop.svg)"></span></button>
<button type="button" data-preview-category="其它" aria-label="其它" data-tip="其它"><span class="preview-toolbar-icon" style="--icon:url(/icons/context-other.svg)"></span></button>
<button type="button" data-preview-action="mark-back" aria-label="返回" data-tip="返回"><span class="preview-toolbar-icon" style="--icon:url(/icons/back.svg)"></span></button>
</div>
</div>
<dialog id="listDialog"><div class="dialog-top"><h2 id="listTitle"></h2><button class="icon" data-close aria-label="关闭">×</button></div><div id="listContent"></div></dialog>
<dialog id="dropDialog"><div class="dialog-top"><h2>把素材放到哪里？</h2><button class="icon" data-close aria-label="关闭">×</button></div><p id="dropSummary"></p><label>选择已有资产<select id="dropTarget"></select></label><div class="dialog-actions"><button id="dropCreate">新建资产并上传</button><button class="primary" id="dropUpload">加入此资产</button></div></dialog>
<input id="fileInput" type="file" accept="image/*,video/*" multiple hidden><input id="candidateFolderInput" type="file" accept="image/*,video/*" webkitdirectory directory multiple hidden><div id="uploads" aria-live="polite"></div><div id="toast" role="status" hidden></div>
<div id="candidateContextMenu" class="candidate-context-menu" hidden role="menu" aria-label="候选素材操作"><button type="button" data-candidate-action="rename" role="menuitem"><span class="context-icon" aria-hidden="true" style="--icon:url(/icons/context-rename.svg)"></span><span class="context-label">重命名</span></button><button type="button" data-candidate-action="mark" role="menuitem" aria-haspopup="true" aria-controls="candidateContextSubmenu"><span class="context-icon" aria-hidden="true" style="--icon:url(/icons/context-mark.svg)"></span><span class="context-label">标记</span><span class="context-arrow" aria-hidden="true" style="--icon:url(/icons/context-arrow.svg)"></span></button><button type="button" data-candidate-action="highlight" role="menuitem"><span class="context-icon" aria-hidden="true" style="--icon:url(/icons/context-highlight.svg)"></span><span class="context-label">高亮显示</span></button><button type="button" data-candidate-action="disable" role="menuitem"><span class="context-icon" aria-hidden="true" style="--icon:url(/icons/context-disable.svg)"></span><span class="context-label">禁用</span></button></div>
<div id="candidateContextSubmenu" class="candidate-context-submenu" role="menu" aria-label="候选素材分类" hidden><button type="button" data-candidate-category="人物" role="menuitem"><span class="context-icon" aria-hidden="true" style="--icon:url(/icons/context-person.svg)"></span><span class="context-label">人物</span></button><button type="button" data-candidate-category="场景" role="menuitem"><span class="context-icon" aria-hidden="true" style="--icon:url(/icons/context-scene.svg)"></span><span class="context-label">场景</span></button><button type="button" data-candidate-category="道具" role="menuitem"><span class="context-icon" aria-hidden="true" style="--icon:url(/icons/context-prop.svg)"></span><span class="context-label">道具</span></button><button type="button" data-candidate-category="其它" role="menuitem"><span class="context-icon" aria-hidden="true" style="--icon:url(/icons/context-other.svg)"></span><span class="context-label">其它</span></button></div>
<script src="/dock.js?v=9ba675baf566" defer></script><script src="/api-client.js?v=4747a28b421a" defer></script><script src="/asset-upload.js?v=e5932bbcab84" defer></script><script src="/entity-forms.js?v=a050f77791b5" defer></script><script src="/asset-board.js?v=b3baa55b4300" defer></script><script src="/app.js?v=5fe4aa5e3e64" defer></script><script src="/activity.js?v=94d753828459" defer></script><script src="/candidate-upload.js?v=0a50b16b2032" defer></script><script src="/candidate-pointer.js?v=381100c99a40" defer></script><script src="/candidate-context-menu.js?v=1aa05776978a" defer></script><script src="/candidate-grid-view.js?v=27e940478668" defer></script><script src="/candidate-library.js?v=9ab4d32a2285" defer></script><script src="/preview.js?v=2521652a55d0" defer></script></body></html>
