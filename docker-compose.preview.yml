services:
  dock-preview:
    build:
      context: ./preview-build
      dockerfile: Dockerfile
    image: team-assets-web-preview:8094
    network_mode: host
    command: ["python", "-m", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8094"]
    environment:
      DATA_DIR: /data
      WEB_DIR: /app/web-dock
      ENABLE_MCP_HTTP: "1"
      MCP_AUTH_MODE: none
      TEAM_ASSETS_PUBLIC_MCP_URL: http://192.168.10.28:8094/mcp/
    volumes:
      - ./data:/data
      - ./web-dock-preview:/app/web-dock:ro
    restart: unless-stopped
