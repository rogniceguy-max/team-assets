<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共创 · 团队资产库</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><a class="brand" href="/" aria-label="共创首页"><span class="brand-mark">✳</span> 共创<span class="brand-en">ASSET SPACE</span></a><nav><button id="historyBtn">最近更新 ↗</button><button id="trashBtn">回收站</button><span id="connection" role="status">连接中</span></nav></header>
<main><section class="hero"><div><div class="eyebrow">A SHARED SPACE FOR EVERY IDEA</div><h1>让好素材，<br>在团队里流动。</h1><p>人物、场景与道具。在同一张工作台上，把想法变成共同的作品。</p></div><div class="hero-art" aria-hidden="true"><div class="art-card art-back">↗</div><div class="art-card art-front"><span>一起创作</span><b>✳</b><small>GOOD IDEAS BELONG HERE.</small></div></div></section>
<section class="workspace" aria-label="资产工作台"><div class="workspace-head"><div><div class="eyebrow">YOUR WORKSPACE</div><div class="project-line"><select id="projectSelect" aria-label="选择项目"></select><button id="projectBtn" class="icon" title="新建项目" aria-label="新建项目">＋</button></div></div><button id="assetBtn" class="primary">＋ 新增资产</button></div>
<div class="toolbar"><div id="categories" class="tabs" aria-label="分类筛选"></div><label class="search"><span>⌕</span><input id="search" placeholder="搜索资产、变体或设定" aria-label="搜索资产、变体或设定"></label></div>
<div class="table-caption"><span id="counts">共 0 个资产</span><span>拖入图片，开始共享 · 修改自动同步</span></div><div id="board"></div></section>
<footer><span>共创 / TEAM ASSET SPACE</span><span>一个地址，一起创作。</span></footer></main>
<dialog id="formDialog"><form id="entityForm"><div class="dialog-top"><h2 id="formTitle"></h2><button type="button" class="icon" data-close aria-label="关闭">×</button></div><div id="formFields"></div><p class="form-error" id="formError" role="alert"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary" id="formSubmit" type="submit">创建</button></div></form></dialog>
<dialog id="detail" class="drawer"><div class="dialog-top"><div><div class="eyebrow">VARIANT DETAILS</div><h2 id="detailTitle"></h2></div><button class="icon" data-close aria-label="关闭详情">×</button></div><form id="detailForm"><label>变体名称<input name="name" required maxlength="200"></label><label>使用集数<input name="episodes" maxlength="500" placeholder="例如：第1–15集"></label><label>设定说明<textarea name="description" rows="5" maxlength="20000"></textarea></label><p id="detailStatus" role="status">修改后点击保存</p><button type="submit" class="primary">保存修改</button></form><section id="conflictBox" hidden><h3>合并其他人的更新</h3><p>你的输入保留在上方。先载入最新内容进行对照，再手动合并。</p><button id="loadLatest" type="button">载入最新版本以对照</button><pre id="latestFields" hidden></pre><button id="mergeVersion" type="button" hidden>我已合并，采用此版本号</button></section><h3>候选素材</h3><div id="detailMaterials" class="material-grid"></div><button id="detailUpload">＋ 上传图片</button></dialog>
<dialog id="preview" class="preview"><div class="dialog-top"><h2 id="previewTitle"></h2><button class="icon" data-close aria-label="关闭预览">×</button></div><img id="previewImage" alt=""><div class="preview-actions"><button id="prevImage" aria-label="上一张">←</button><button id="nextImage" aria-label="下一张">→</button><span id="previewSource"></span><a id="download" class="button" download>下载原图 ↗</a><button id="setFinal" class="primary">设为定稿</button><button id="deleteMaterial">移入回收站</button></div></dialog>
<dialog id="listDialog"><div class="dialog-top"><h2 id="listTitle"></h2><button class="icon" data-close aria-label="关闭">×</button></div><div id="listContent"></div></dialog>
<dialog id="dropDialog"><div class="dialog-top"><h2>把素材放到哪里？</h2><button class="icon" data-close aria-label="关闭">×</button></div><p id="dropSummary"></p><label>选择已有变体<select id="dropTarget"></select></label><div class="dialog-actions"><button id="dropCreate">新建资产并上传</button><button class="primary" id="dropUpload">加入此变体</button></div></dialog>
<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><div id="uploads" aria-live="polite"></div><div id="toast" role="status" hidden></div><script src="/app.js" defer></script></body></html>
